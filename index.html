<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Redirect Page" />
    <title>Redirecting...</title>
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&amp;display=swap" rel="stylesheet" />
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="static/js/scripts.js"></script>
    <style>
        body {
            font-family: 'Mulish', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .redirect-container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        .redirect-container h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .redirect-link {
            color: #ffd700;
            text-decoration: underline;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .redirect-link:hover {
            color: #fff;
        }
    </style>
</head>

<body id="page-top">
    <div class="redirect-container">
        <h1 id="redirect-text">若长时间未跳转，请点击下方</h1>
        <a id="redirect-link" class="redirect-link" href="#">儿童先心病AI辅助诊断与教学系统平台</a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            fetch('redirect-config.json')
                .then(response => response.json())
                .then(config => {
                    if (config.enabled && config.target_url) {
                        var link = document.getElementById('redirect-link');
                        link.href = config.target_url;
                        link.addEventListener('click', function(e) {
                            e.preventDefault();
                            window.location.href = config.target_url;
                        });
                    }
                })
                .catch(error => console.log('Redirect config not found:', error));
        });
    </script>
</body>

</html>
